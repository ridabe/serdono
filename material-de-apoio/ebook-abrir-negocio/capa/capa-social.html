<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="_base.css">
<style>
  body{ width:1200px; height:630px; background:var(--brand900); overflow:hidden; position:relative; color:var(--white); }
  .bg{ position:absolute; inset:0; opacity:.10; }
  .wrap{ position:absolute; inset:0; display:flex; flex-direction:column; padding:64px 72px; }
  .top{ display:flex; align-items:center; gap:16px; }
  .mark{ width:48px; height:48px; }
  .word{ font-size:26px; font-weight:800; letter-spacing:-.4px; }
  .word b{ color:var(--gold500); }
  .kicker{ margin-top:44px; align-self:flex-start; background:var(--gold500); color:var(--brand900);
    font-weight:700; font-size:17px; letter-spacing:2px; padding:9px 20px; border-radius:999px; }
  h1{ margin-top:26px; font-size:66px; line-height:1.05; font-weight:800; letter-spacing:-1.5px; max-width:15ch; }
  h1 .hl{ color:var(--gold500); }
  .sub{ margin-top:22px; font-size:24px; line-height:1.45; color:var(--brand100); max-width:30ch; }
  .steps{ position:absolute; right:-30px; bottom:-30px; width:340px; height:340px; }
</style></head>
<body>
<svg class="bg" viewBox="0 0 1200 630" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
  <g fill="none" stroke="#BFD4DC" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-100 560 H150 V420 H400 V300 H650 V180 H900 V60 H1200"/>
    <path d="M-100 700 H250 V520 H550 V380 H820 V240 H1080 V110 H1340"/>
  </g>
</svg>
<div class="wrap">
  <div class="top">
    <svg class="mark" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <rect width="100" height="100" rx="24" fill="#F2B03D"/>
      <path d="M23 78 H41 V62 H59 V46 H72" fill="none" stroke="#0E3A4F" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="72" cy="27" r="9" fill="#0E3A4F"/>
    </svg>
    <span class="word sora">Ser<b>Dono</b></span>
  </div>
  <span class="kicker sora">GUIA GRATUITO</span>
  <h1 class="sora">Abrir um negócio <span class="hl">do zero</span></h1>
  <p class="sub">O mercado, as vantagens, os cuidados — e como sair do papel com ajuda de verdade.</p>
</div>
<svg class="steps" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <path d="M8 92 H30 V70 H52 V48 H74" fill="none" stroke="#F2B03D" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="74" cy="26" r="11" fill="#F2B03D"/>
</svg>
</body></html>
